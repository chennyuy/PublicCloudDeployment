<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Cloud Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef3f8;
            text-align: center;
            padding: 60px 20px;
        }

        .container {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 35px;
            border-radius: 12px;
        }

        h1 {
            color: #0078d4;
        }

        button {
            background: #0078d4;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to My Cloud Website!</h1>

        <p>This website is hosted using Public Cloud services.</p>

        <p>Cloud Security Laboratory Activity</p>

        <button onclick="alert('Website deployed successfully!')">
            Test Website
        </button>
    </div>
</body>
</html>
